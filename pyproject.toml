[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debtscope"
version = "0.3.1"
description = "AI-powered technical debt dashboard: one sentence to define a metric, one scan to see the trend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Debtscope Contributors" }]
keywords = ["technical-debt", "code-quality", "static-analysis", "llm", "dashboard", "dead-code", "ast", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
debtscope = "debtscope.cli:main"

[project.urls]
Homepage = "https://github.com/taoyongpan/Debtscope"
Repository = "https://github.com/taoyongpan/Debtscope"
Issues = "https://github.com/taoyongpan/Debtscope/issues"
Changelog = "https://github.com/taoyongpan/Debtscope/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["debtscope*"]

[tool.setuptools.package-data]
"debtscope.web" = ["static/*"]
